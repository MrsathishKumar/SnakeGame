<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enhanced Animated Snake Game</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }
  body {
    background: radial-gradient(circle at center, #101924 0%, #05070a 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #e2e8f0;
    padding: 20px;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    width: 600px;
    margin-bottom: 12px;
    font-weight: 600;
    font-size: 1.1rem;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(0, 255, 170, 0.4);
  }
  .canvas-wrapper {
    position: relative;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 255, 170, 0.15);
    border-radius: 12px;
    border: 2px solid rgba(0, 255, 170, 0.3);
    overflow: hidden;
  }
  canvas {
    display: block;
    background-color: #080c10;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(8, 12, 16, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .overlay h1 {
    font-size: 2.2rem;
    color: #00ffaa;
    text-shadow: 0 0 16px #00ffaa;
  }
  .btn-group {
    display: flex;
    gap: 12px;
    margin-top: 15px;
    width: 600px;
    justify-content: center;
  }
  .btn {
    padding: 10px 20px;
    font-size: 0.95rem;
    font-weight: bold;
    color: #080c10;
    background: #00ffaa;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
    transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 16px rgba(0, 255, 170, 0.8);
  }
  .btn-danger {
    background: #ff4757;
    box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
    color: #fff;
  }
  .btn-danger:hover {
    box-shadow: 0 0 16px rgba(255, 71, 87, 0.8);
  }
  .btn-secondary {
    background: #334155;
    color: #e2e8f0;
    box-shadow: none;
  }
  .btn-secondary:hover {
    background: #475569;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
  }
  select.btn {
    outline: none;
    appearance: none;
    text-align: center;
    background: #1e293b;
    color: #00ffaa;
    border: 1px solid #00ffaa;
  }
  .controls-hint {
    margin-top: 12px;
    font-size: 0.85rem;
    color: #64748b;
  }
</style>
</head>
<body>

<div class="hud">
  <div>Score: <span id="scoreVal">0</span></div>
  <div>High Score: <span id="highScoreVal">0</span></div>
</div>

<div class="canvas-wrapper">
  <!-- Expanded game board from 440px to 600px -->
  <canvas id="gameCanvas" width="600" height="600"></canvas>
  <div id="gameOverlay" class="overlay">
    <h1 id="overlayTitle">PAUSED</h1>
    <button class="btn" id="overlayBtn">Resume</button>
  </div>
</div>

<div class="btn-group">
  <button class="btn" id="startBtn">Start</button>
  <button class="btn btn-secondary" id="pauseBtn">Pause</button>
  <button class="btn btn-danger" id="stopBtn">Stop Game</button>
  <select class="btn" id="difficultySelect">
    <option value="120">Easy</option>
    <option value="85" selected>Medium</option>
    <option value="55">Fast</option>
  </select>
</div>

<div class="controls-hint">
  [Arrow Keys / WASD] Move &bull; [Space / P] Pause &bull; [R] Restart
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('gameOverlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayBtn = document.getElementById('overlayBtn');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const difficultySelect = document.getElementById('difficultySelect');
  const scoreDisplay = document.getElementById('scoreVal');
  const highScoreDisplay = document.getElementById('highScoreVal');

  const GRID_SIZE = 24; 
  const CELL_COUNT = canvas.width / GRID_SIZE; // 25 x 25 grid

  let snake = [];
  let velocity = { x: 0, y: 0 };
  let nextVelocity = { x: 0, y: 0 };
  let food = { x: 0, y: 0 };
  let particles = [];
  let score = 0;
  let highScore = parseInt(localStorage.getItem('snakeHighScore2')) || 0;
  let isPaused = false;
  let isGameOver = false;
  let isRunning = false;
  let lastTick = 0;
  let tickInterval = parseInt(difficultySelect.value);

  highScoreDisplay.textContent = highScore;

  // Sound Engine (Web Audio API)
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, duration, type = 'sine') {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function initGame() {
    snake = [
      { x: 12, y: 12 },
      { x: 11, y: 12 },
      { x: 10, y: 12 }
    ];
    velocity = { x: 1, y: 0 };
    nextVelocity = { x: 1, y: 0 };
    score = 0;
    scoreDisplay.textContent = score;
    isGameOver = false;
    isPaused = false;
    isRunning = true;
    particles = [];
    overlay.classList.remove('active');
    pauseBtn.textContent = "Pause";
    spawnFood();
  }

  function spawnFood() {
    let valid = false;
    while (!valid) {
      food.x = Math.floor(Math.random() * CELL_COUNT);
      food.y = Math.floor(Math.random() * CELL_COUNT);
      valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
    }
  }

  function createParticles(x, y, color) {
    for (let i = 0; i < 18; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3.5 + 1;
      particles.push({
        x: x * GRID_SIZE + GRID_SIZE / 2,
        y: y * GRID_SIZE + GRID_SIZE / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        alpha: 1,
        color: color
      });
    }
  }

  function togglePause() {
    if (!isRunning || isGameOver) return;
    isPaused = !isPaused;
    if (isPaused) {
      overlayTitle.textContent = "PAUSED";
      overlayBtn.textContent = "Resume";
      overlay.classList.add('active');
      pauseBtn.textContent = "Resume";
    } else {
      overlay.classList.remove('active');
      pauseBtn.textContent = "Pause";
    }
  }

  function triggerGameOver() {
    isGameOver = true;
    isRunning = false;
    playSound(140, 0.4, 'sawtooth');
    overlayTitle.textContent = "GAME OVER";
    overlayBtn.textContent = "Play Again";
    overlay.classList.add('active');
  }

  function stopGame() {
    isRunning = false;
    isPaused = false;
    overlayTitle.textContent = "STOPPED";
    overlayBtn.textContent = "Start";
    overlay.classList.add('active');
  }

  // Inputs & Controls
  window.addEventListener('keydown', e => {
    const key = e.key.toLowerCase();
    if ((key === 'arrowup' || key === 'w') && velocity.y === 0) {
      nextVelocity = { x: 0, y: -1 };
    } else if ((key === 'arrowdown' || key === 's') && velocity.y === 0) {
      nextVelocity = { x: 0, y: 1 };
    } else if ((key === 'arrowleft' || key === 'a') && velocity.x === 0) {
      nextVelocity = { x: -1, y: 0 };
    } else if ((key === 'arrowright' || key === 'd') && velocity.x === 0) {
      nextVelocity = { x: 1, y: 0 };
    } else if (key === 'p' || key === ' ') {
      togglePause();
    } else if (key === 'r') {
      initGame();
    }
  });

  startBtn.addEventListener('click', () => initGame());
  pauseBtn.addEventListener('click', () => togglePause());
  stopBtn.addEventListener('click', () => stopGame());
  overlayBtn.addEventListener('click', () => {
    if (!isRunning || isGameOver) {
      initGame();
    } else {
      togglePause();
    }
  });

  difficultySelect.addEventListener('change', (e) => {
    tickInterval = parseInt(e.target.value);
  });

  function update() {
    velocity = { ...nextVelocity };
    const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

    // Wall collision
    if (head.x < 0 || head.x >= CELL_COUNT || head.y < 0 || head.y >= CELL_COUNT) {
      createParticles(snake[0].x, snake[0].y, '#ff4757');
      triggerGameOver();
      return;
    }

    // Body collision
    if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
      createParticles(head.x, head.y, '#ff4757');
      triggerGameOver();
      return;
    }

    snake.unshift(head);

    // Eating Food
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreDisplay.textContent = score;
      if (score > highScore) {
        highScore = score;
        highScoreDisplay.textContent = highScore;
        localStorage.setItem('snakeHighScore2', highScore);
      }
      playSound(620, 0.12, 'sine');
      createParticles(food.x, food.y, '#00ffaa');
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function renderSnakeHead(seg, timestamp) {
    const cx = seg.x * GRID_SIZE + GRID_SIZE / 2;
    const cy = seg.y * GRID_SIZE + GRID_SIZE / 2;

    ctx.save();
    ctx.translate(cx, cy);

    let angle = 0;
    if (velocity.x === 1) angle = 0;
    else if (velocity.x === -1) angle = Math.PI;
    else if (velocity.y === 1) angle = Math.PI / 2;
    else if (velocity.y === -1) angle = -Math.PI / 2;
    ctx.rotate(angle);

    // Glowing Cobra/Viper head shape
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#00ffaa';
    ctx.fillStyle = '#00e676';
    ctx.beginPath();
    ctx.ellipse(0, 0, GRID_SIZE / 2, GRID_SIZE / 2.3, 0, 0, Math.PI * 2);
    ctx.fill();

    // Animated Flickering Tongue
    const tongueAnim = Math.sin(timestamp / 100) * 4;
    ctx.strokeStyle = '#ff3838';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(GRID_SIZE / 2, 0);
    ctx.lineTo(GRID_SIZE / 2 + 5 + tongueAnim, 0);
    ctx.lineTo(GRID_SIZE / 2 + 8 + tongueAnim, -2);
    ctx.moveTo(GRID_SIZE / 2 + 5 + tongueAnim, 0);
    ctx.lineTo(GRID_SIZE / 2 + 8 + tongueAnim, 2);
    ctx.stroke();

    // Eyes
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(3, -5, 2.5, 0, Math.PI * 2);
    ctx.arc(3, 5, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Slit pupils
    ctx.fillStyle = '#ffff00';
    ctx.beginPath();
    ctx.arc(3.5, -5, 1.2, 0, Math.PI * 2);
    ctx.arc(3.5, 5, 1.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function renderSnakeBody(seg, index) {
    const cx = seg.x * GRID_SIZE + GRID_SIZE / 2;
    const cy = seg.y * GRID_SIZE + GRID_SIZE / 2;
    const radius = Math.max(5, (GRID_SIZE / 2) - 1.5);

    ctx.save();
    // Alternating segment shades for realistic skin patterns
    const isAlt = index % 2 === 0;
    const baseColor = isAlt ? '#00b894' : '#009472';
    const scalePattern = isAlt ? '#55efc4' : '#00cec9';

    ctx.shadowBlur = 4;
    ctx.shadowColor = '#00b894';
    ctx.fillStyle = baseColor;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();

    // Center Dorsal Diamond/Scale
    ctx.fillStyle = scalePattern;
    ctx.beginPath();
    ctx.arc(cx, cy, radius / 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function render(timestamp) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Precision Grid
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.035)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
      ctx.beginPath();
      ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
      ctx.stroke();
    }

    // Animated Apple / Glowing Orb
    const pulse = Math.sin(timestamp / 180) * 2;
    ctx.save();
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ff4757';
    ctx.fillStyle = '#ff4757';
    ctx.beginPath();
    ctx.arc(
      food.x * GRID_SIZE + GRID_SIZE / 2,
      food.y * GRID_SIZE + GRID_SIZE / 2,
      Math.max(2, GRID_SIZE / 2 - 2 + pulse),
      0,
      Math.PI * 2
    );
    ctx.fill();
    ctx.restore();

    // Render Snake (tail first, head last)
    for (let i = snake.length - 1; i > 0; i--) {
      renderSnakeBody(snake[i], i);
    }
    if (snake.length > 0) {
      renderSnakeHead(snake[0], timestamp);
    }

    // Render Particle Engine
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.035;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function gameLoop(timestamp) {
    if (isRunning && !isPaused && !isGameOver) {
      if (timestamp - lastTick >= tickInterval) {
        update();
        lastTick = timestamp;
      }
    }
    render(timestamp);
    requestAnimationFrame(gameLoop);
  }

  initGame();
  requestAnimationFrame(gameLoop);
</script>
</body>
</html>
